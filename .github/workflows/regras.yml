# Publica as regras do Firestore no projeto dolomitesgt sempre que
# firestore.rules muda no main, ou a pedido. Usa a mesma conta de
# serviço da publicação da app (FIREBASE_SERVICE_ACCOUNT_DOLOMITESGT),
# que precisa do papel «Firebase Rules Admin» no projeto.
# As regras do Storage continuam a publicar-se à mão.
name: Publicar regras

on:
  push:
    branches: [main]
    paths: [firestore.rules]
  workflow_dispatch:

concurrency:
  group: regras
  cancel-in-progress: false

jobs:
  firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publicar as regras do Firestore
        env:
          CONTA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOLOMITESGT }}
        run: |
          printf '%s' "$CONTA" > "$RUNNER_TEMP/conta.json"
          # Qual é a conta de serviço — o endereço, nunca a chave.
          echo "Conta de serviço: $(jq -r .client_email "$RUNNER_TEMP/conta.json")"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/conta.json"
          npx --yes firebase-tools@13 deploy --only firestore:rules --project dolomitesgt --non-interactive
          rm -f "$RUNNER_TEMP/conta.json"
